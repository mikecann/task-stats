name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              $failed = $true
              $parseErrors | ForEach-Object { Write-Host $_ }
            }
          }
          if ($failed) { exit 1 }
      - name: Build all .NET projects
        shell: pwsh
        run: |
          $projects = @('task-stats.csproj', 'tests/unit/TaskStats.UnitTests.csproj', 'tests/integration/TaskStats.IntegrationTests.csproj', 'tests/visual/TaskStats.VisualHarness.csproj')
          foreach ($project in $projects) {
            dotnet build $project -c Release -nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test projects and run their console test runners
        shell: pwsh
        run: |
          # These projects use their own Main/assertions, so dotnet test alone
          # does not run them. Always execute both runners and check exit codes.
          foreach ($project in @('tests/unit/TaskStats.UnitTests.csproj', 'tests/integration/TaskStats.IntegrationTests.csproj')) {
            dotnet test $project -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project $project -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: oven-sh/setup-bun@v2
      - name: Test screenshot judge configuration without API calls
        working-directory: tests/e2e
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bunx tsc --noEmit --module preserve --moduleResolution bundler --target esnext --types bun-types --skipLibCheck evaluate-screenshots.ts evaluate-screenshots.test.ts
          exit $LASTEXITCODE
